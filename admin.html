<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Café | Administrador</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS CSS --- */
        :root {
            --cafe-oscuro: #2c1a10;
            --cafe-medio: #6b3e26;
            --crema: #fdf5e6;
            --dorado: #c69c6d;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--crema);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Video de fondo (Opcional, igual que tu index) */
        .video-fondo {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
            filter: brightness(0.5);
        }

        /* Tarjeta de Login */
        .admin-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--dorado);
            z-index: 1;
        }

        h2 { font-family: 'Playfair Display', serif; color: var(--cafe-oscuro); }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--cafe-medio);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover { background: var(--cafe-oscuro); }

        /* Panel de Control (Oculto al inicio) */
        #panel-control { display: none; }

        .dashboard {
            text-align: left;
        }

        .logout-btn {
            background: #e74c3c;
            margin-top: 20px;
        }

        .mensaje-exito {
            color: #27ae60;
            display: none;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <video class="video-fondo" src="videoindex.mp4" autoplay muted loop playsinline></video>
    <div id="seccion-login" class="admin-card">
        <i class="fas fa-user-lock" style="font-size: 3rem; color: var(--dorado); margin-bottom: 15px;"></i>
        <h2>Panel Admin</h2>
        <p>Inicia sesión para gestionar la web</p>
        
        <input type="text" id="usuario" placeholder="Usuario (admin)">
        <input type="password" id="password" placeholder="Contraseña (retro123)">
        
        <button class="btn" onclick="login()">Ingresar</button>
        <p id="error" style="color: red; display: none; font-size: 0.8rem;">Usuario o clave incorrectos</p>
    </div>

    <div id="panel-control" class="admin-card dashboard">
        <h2>Bienvenido, Admin</h2>
        <p>Estás en el centro de control de <b>Retro Café</b>.</p>
        <hr>

        <label><b>Cambiar texto de bienvenida:</b></label>
        <input type="text" id="texto-hero" placeholder="Escribe el nuevo mensaje...">
        
        <button class="btn" onclick="guardarConfig()">Actualizar Web</button>
        <p id="msg-exito" class="mensaje-exito">¡Cambio guardado localmente!</p>

        <button class="btn logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>

    <script>
        /* --- LÓGICA JAVASCRIPT --- */

        // 1. Datos de acceso (Simulados)
        const USER_CORRECTO = "admin";
        const PASS_CORRECTO = "retro123";

        // 2. Función de Login
        function login() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('error');

            if (user === USER_CORRECTO && pass === PASS_CORRECTO) {
                // Guardamos la sesión en el navegador
                localStorage.setItem('admin_logueado', 'true');
                mostrarDashboard();
            } else {
                error.style.display = 'block';
            }
        }

        // 3. Mostrar el Panel
        function mostrarDashboard() {
            document.getElementById('seccion-login').style.display = 'none';
            document.getElementById('panel-control').style.display = 'block';
        }

        // 4. Guardar cambios (Persistencia)
        function guardarConfig() {
            const nuevoTexto = document.getElementById('texto-hero').value;
            if (nuevoTexto.trim() !== "") {
                // Guardamos el texto para que index.html lo pueda leer
                localStorage.setItem('hero_text_personalizado', nuevoTexto);
                
                const msg = document.getElementById('msg-exito');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            }
        }

        // 5. Cerrar Sesión
        function logout() {
            localStorage.removeItem('admin_logueado');
            window.location.reload();
        }

        // 6. Verificar sesión al cargar la página
        window.onload = function() {
            if (localStorage.getItem('admin_logueado') === 'true') {
                mostrarDashboard();
            }
        };
        // Al cargar el index, revisa si el admin cambió el texto
window.addEventListener('load', () => {
    const textoAdmin = localStorage.getItem('hero_text_personalizado');
    if (textoAdmin) {
        document.getElementById('typewriter').innerText = textoAdmin;
    }
});
    </script>

</body>
</html>
